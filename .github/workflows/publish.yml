name: Build and publish Umbrel preview
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image (including Rust checks)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile.umbrel
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ghcr.io/mandebitcoin/mostro-community-umbrel:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=manager-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=manager-${{ matrix.arch }}
      - name: Test container and persistence
        env:
          IMAGE: ghcr.io/mandebitcoin/mostro-community-umbrel:sha-${{ github.sha }}-${{ matrix.arch }}
        run: ./scripts/container-smoke.sh "$IMAGE"
      - name: Verify read-only LND TLS adapter in container
        env:
          IMAGE: ghcr.io/mandebitcoin/mostro-community-umbrel:sha-${{ github.sha }}-${{ matrix.arch }}
        run: python3 scripts/lnd-smoke.py --image "$IMAGE"
      - name: Verify optional Mostro image without starting daemon
        run: |
          sh scripts/mostro-entrypoint-smoke.sh
          docker build --platform linux/${{ matrix.arch }} --file docker/Dockerfile.mostro --tag mostro-upstream-check:${{ matrix.arch }} .
          docker run --rm --network none mostro-upstream-check:${{ matrix.arch }} --version
          if docker run --rm --network none mostro-upstream-check:${{ matrix.arch }}; then
            echo "Mostro image must refuse to start without settings and identity" >&2
            exit 1
          fi
      - name: Publish tested architecture
        env:
          IMAGE: ghcr.io/mandebitcoin/mostro-community-umbrel:sha-${{ github.sha }}-${{ matrix.arch }}
        run: docker push "$IMAGE"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          IMAGE: ghcr.io/mandebitcoin/mostro-community-umbrel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' > image-manifest.json
      - name: Verify anonymous registry access
        run: python3 scripts/verify-public-image.py "${GITHUB_REF_NAME#v}"
      - name: Create preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" image-manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" image-manifest.json --verify-tag --prerelease --title "Mostro Community Manager $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi
