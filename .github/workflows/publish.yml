name: Build and publish Umbrel release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: umbrel-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test release metadata gate
        run: python3 -m unittest discover -s scripts/tests
      - name: Reject store version bumps before the image exists
        run: python3 scripts/release_metadata.py check-candidate "$GITHUB_REF_NAME"
  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image (including Rust checks)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile.umbrel
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ghcr.io/mandebitcoin/mostro-community-umbrel:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=manager-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=manager-${{ matrix.arch }}
      - name: Test container and persistence
        env:
          IMAGE: ghcr.io/mandebitcoin/mostro-community-umbrel:sha-${{ github.sha }}-${{ matrix.arch }}
        run: ./scripts/container-smoke.sh "$IMAGE"
      - name: Verify read-only LND TLS adapter in container
        env:
          IMAGE: ghcr.io/mandebitcoin/mostro-community-umbrel:sha-${{ github.sha }}-${{ matrix.arch }}
        run: python3 scripts/lnd-smoke.py --image "$IMAGE"
      - name: Verify optional Mostro image without starting daemon
        run: bash scripts/verify-mostro-image.sh
      - name: Publish tested architecture
        env:
          IMAGE: ghcr.io/mandebitcoin/mostro-community-umbrel:sha-${{ github.sha }}-${{ matrix.arch }}
        run: docker push "$IMAGE"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          IMAGE: ghcr.io/mandebitcoin/mostro-community-umbrel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' > image-manifest.json
      - name: Verify anonymous registry access
        run: python3 scripts/verify-public-image.py "${GITHUB_REF_NAME#v}"
      - name: Create preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" image-manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" image-manifest.json --verify-tag --prerelease --title "Mostro Community Manager $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi
      - name: Promote verified image in the Umbrel store
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_VERSION="$(python3 -c 'from scripts.release_metadata import current_version; print(current_version())')"
          cp docs/release-notes.md "$RUNNER_TEMP/mostro-release-notes.md"
          git fetch origin main:refs/remotes/origin/main
          git switch -C release-promotion origin/main
          if [ "$(python3 -c 'from scripts.release_metadata import current_version; print(current_version())')" = "$VERSION" ]; then
            python3 scripts/release_metadata.py check-store
            exit 0
          fi
          python3 scripts/release_metadata.py promote "$GITHUB_REF_NAME" --expected-current "$CURRENT_VERSION" --notes-file "$RUNNER_TEMP/mostro-release-notes.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md mandebitcoin-mostro-manager/umbrel-app.yml mandebitcoin-mostro-manager/docker-compose.yml
          git commit -m "release: promote $GITHUB_REF_NAME in Umbrel store"
          PROMOTION_BRANCH="release-promotion-$VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$PROMOTION_BRANCH"
          PR_URL="$(gh pr create --base main --head "$PROMOTION_BRANCH" --title "release: promote $GITHUB_REF_NAME in Umbrel store" --body "Automated promotion for $GITHUB_REF_NAME in Umbrel store")"
          for attempt in $(seq 1 15); do
            if [ -n "$(gh pr checks "$PR_URL" --json name -q '.[].name' 2>/dev/null)" ]; then
              break
            fi
            sleep 2
          done
          gh pr checks "$PR_URL" --watch --required
          gh pr merge "$PR_URL" --squash --delete-branch
