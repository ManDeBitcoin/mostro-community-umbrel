releaseNotes: >-
  Patch 1.0.3:
  - Navegación de Configuración: Resuelto bug estético donde el indicador highlight quedaba fijo en Identidad. Ahora sigue dinámicamente la sección activa (Identidad, Mercado, Seguridad, Nostr, Métodos de pago) y sincroniza con el scroll.
  - Métodos de Pago: Sistema interactivo de Tags dinámicos ("TAC") con resumen de categorías en uso y asignación directa con 1 clic para mantener la coherencia del catálogo. Auto-slug para ID de métodos de pago.

  Patch 1.0.2: Implementación completa del flujo de activación del demonio. Mostro ahora arranca atómicamente tras guardar la configuración y publica su Info Event correctamente. Interrupción rápida del standby optimizada en el entrypoint. Nuevos botones de Activación/Desactivación en el Dashboard del mánager.

  Patch 1.0.1: Corrección visual del cursor (loading) en los botones inactivos de la Consola de Mediación.

  Versión de Producción 1.0.0 (Fase Final de Integración y Operador):
  - Nueva pestaña de Operaciones LND y Gestión de Liquidez con monitor de capacidad, balances entrantes/salientes y manual paso a paso para operadores (Alby Hub, LSPs, rebalanceo).
  - Nuevo endpoint de solo lectura /api/lnd/channels con datos estructurados de canales y liquidez.
  - Verificación integral de ciclo completo automatizada (scripts/verify-e2e.sh).
  - Consola de mediación con chat cifrado en memoria para resolución de conflictos.
  - Monitor en vivo de órdenes públicas Nostr Kind 38383.
  - Simulador sintético del protocolo P2P con cálculo exacto de fianzas y comisiones.
  - Notificaciones en tiempo real vía SSE y backups automáticos offsite con retención programada.
  - Endurecimiento integral de seguridad: contenedores read-only, cap_drop ALL, red privada segregada y protección anti-CSRF / rate limiting en API.
