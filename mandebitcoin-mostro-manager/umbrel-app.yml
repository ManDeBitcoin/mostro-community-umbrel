  - https://raw.githubusercontent.com/ManDeBitcoin/mostro-community-umbrel/main/docs/screenshots/dashboard.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Módulo 2: Simulador interactivo del ciclo completo P2P (Happy Path, disputas
  y cancelaciones), cálculo exacto de bonds y comisiones, eventos Nostr Kind 4/38383,
  Hold Invoices Lightning, vista interactiva en dashboard y fixture Docker Regtest.
