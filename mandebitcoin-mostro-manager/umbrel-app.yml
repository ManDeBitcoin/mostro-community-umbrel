gallery:
  - https://raw.githubusercontent.com/ManDeBitcoin/mostro-community-umbrel/main/docs/screenshots/dashboard.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Módulo 3A: Monitor de órdenes públicas y cálculo corregido de simulador.
  Se implementó un monitor WebSocket de solo lectura en la interfaz para mostrar las órdenes públicas Nostr del nodo en tiempo real, resolviendo estados dinámicos. Corrección de aritmética del simulador para el exacto 50/50 split de comisiones Mostro.
