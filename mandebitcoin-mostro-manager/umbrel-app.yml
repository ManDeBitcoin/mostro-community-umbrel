manifestVersion: 1
id: mandebitcoin-mostro-manager
name: Mostro Community Manager
tagline: Prepara tu comunidad P2P con Mostro
icon: https://raw.githubusercontent.com/ManDeBitcoin/mostro-community-umbrel/main/assets/icon.svg
category: bitcoin
version: 0.1.0-preview.10
port: 5173
description: >-
  Vista previa del panel administrativo de comunidades Mostro.
  Permite guardar la identidad pública y el borrador de reglas del mercado:
  monedas, límites, comisiones, bonds, relays y catálogo de pagos.

  Esta versión incorpora el demonio oficial Mostro (v0.18.8) con orquestación
  y activación atómica en espera pasiva (Módulo 1). Consulta el estado de LND
  con un macaroon de solo lectura y validación TLS.
  Permite generar nprofile y QR SVG para conexión directa con Mostro App.
  La activación del demonio está protegida y en espera hasta la confirmación
  explícita por el operador en el panel web.
developer: ManDeBitcoin
website: https://github.com/ManDeBitcoin/mostro-community-umbrel
repo: https://github.com/ManDeBitcoin/mostro-community-umbrel
support: https://github.com/ManDeBitcoin/mostro-community-umbrel/issues
dependencies: [lightning]
gallery:
  - https://raw.githubusercontent.com/ManDeBitcoin/mostro-community-umbrel/main/docs/screenshots/dashboard.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Orquestación del demonio Mostro (Módulo 1): máquina de estados con activación
  atómica, modo de espera protegido en Compose (sin bucles de reinicio), imagen
  unificada v0.18.8 y panel de control web con telemetría en vivo.
