gallery:
  - https://raw.githubusercontent.com/ManDeBitcoin/mostro-community-umbrel/main/docs/screenshots/dashboard.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Módulo 4: Notificaciones, Backups Automáticos Offsite y Hardening.
  Incluye notificaciones en tiempo real vía SSE, retención de backups automatizados cifrados y límites de peticiones (rate limiting) en API. Endurecimiento de contenedores con privilegios mínimos y aislamiento estricto.
