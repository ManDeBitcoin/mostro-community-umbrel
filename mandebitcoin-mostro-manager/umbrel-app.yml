id: mandebitcoin-mostro-manager
name: Mostro Community Manager
tagline: Administra tu comunidad P2P soberana sobre Mostro y Lightning
icon: https://raw.githubusercontent.com/ManDeBitcoin/mostro-community-umbrel/main/assets/icon.png
category: bitcoin
version: 1.0.12
port: 5173
description: >-
  Mostro Community Manager es la plataforma nativa para Umbrel diseñada para que
  cualquier operador cree, configure y administre su propia comunidad de intercambio
  P2P soberana de Bitcoin sobre el protocolo Mostro y Lightning Network.

  Características principales:
  • Configuración de Mercado: Define monedas fiat locales, límites por operación,
  comisiones de operador y desarrollo, depósitos de garantía (bonds) y relays Nostr.
  • Orquestación del Motor Mostro: Ciclo de vida y activación atómica del daemon
  oficial upstream sin necesidad de forks ni compilaciones manuales.
  • Gestión de Liquidez Lightning (LND): Supervisión en tiempo real de canales,
  balance local vs balance entrante (inbound liquidity) y guía integrada para
  conseguir liquidez entrante y saliente en el nodo LND de Umbrel.
  • Monitor de Órdenes Públicas: Visualización y seguimiento en vivo de eventos
  Nostr Kind 38383 de solo lectura emitidos por la comunidad.
  • Consola de Mediación de solo lectura: disputas anunciadas por el nodo e
  historial de mensajes de protocolo de cada orden, con la guía para resolverlas
  desde un cliente de mediación.
  • Alertas y Notificaciones en Vivo: Transmisión reactiva de eventos críticos,
  caída de relays y disputas activas mediante Server-Sent Events (SSE).
  • Respaldos Cifrados: Copia con age de la identidad del nodo y las reglas de la
  comunidad, creada desde el panel. Conviene guardarla también fuera del equipo.
  • Conexión de clientes Mostro mediante tarjeta firmada de la comunidad, código
  QR y nprofile con relays.
