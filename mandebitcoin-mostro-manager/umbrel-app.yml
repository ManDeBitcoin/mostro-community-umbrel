manifestVersion: 1
id: mandebitcoin-mostro-manager
name: Mostro Community Manager
tagline: Prepara tu comunidad P2P con Mostro
icon: https://raw.githubusercontent.com/ManDeBitcoin/mostro-community-umbrel/main/assets/icon.svg
category: bitcoin
version: 0.1.0-preview.6
port: 5173
description: >-
  Vista previa del panel administrativo de comunidades Mostro.
  Permite guardar la identidad pública y el borrador de reglas del mercado:
  monedas, límites, comisiones, bonds, relays y catálogo de pagos.

  Esta versión no inicia Mostro ni conecta Bitcoin. Consulta el estado de LND
  con un macaroon de solo lectura y validación TLS.
  Utiliza datos propios y puede convivir con una instalación existente.
  Permite importar una clave Nostr localmente por terminal, verificando su npub.
  No importa bases de datos ni operaciones del Mostro actual.
  El arranque de mercado, las disputas y la migración todavía no están disponibles.
developer: ManDeBitcoin
website: https://github.com/ManDeBitcoin/mostro-community-umbrel
repo: https://github.com/ManDeBitcoin/mostro-community-umbrel
support: https://github.com/ManDeBitcoin/mostro-community-umbrel/issues
dependencies: [lightning]
gallery:
  - https://raw.githubusercontent.com/ManDeBitcoin/mostro-community-umbrel/main/docs/screenshots/dashboard.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Consulta de lectura al LND de Umbrel con TLS y macaroon readonly. Muestra
  sincronización de cadena/grafo, red, canales y saldo agregado. Conserva el
  borrador y la identidad importada. No ejecuta el daemon Mostro.
submitter: ManDeBitcoin
submission: https://github.com/ManDeBitcoin/mostro-community-umbrel
