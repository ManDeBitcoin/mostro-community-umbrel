releaseNotes: >-
  Módulo 3B: Chat Cifrado y Consola de Arbitraje Asistido.
  Descifrado y almacenamiento seguro local de mensajes Nostr NIP-04 y NIP-44/59 para mediadores. Inclusión de la interfaz de Consola de Mediación. Monitor de órdenes ahora completamente probado con Mocks E2E y sin filtraciones de red.
