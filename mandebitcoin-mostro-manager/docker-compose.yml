version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: mandebitcoin-mostro-manager_web_1
      APP_PORT: 3001
    networks:
      - default
      - manager_private
  init:
    image: ghcr.io/mandebitcoin/mostro-community-umbrel:0.1.0-preview.13
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/config && chown 1000:1000 /data /data/config && chmod 700 /data /data/config"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    networks: [manager_private]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
  lnd_bridge:
    image: ghcr.io/mandebitcoin/mostro-community-umbrel:0.1.0-preview.13
    entrypoint: ["mostro-community-api", "lnd-tunnel"]
    healthcheck:
      disable: true
    environment:
      LND_TUNNEL_TARGET: ${APP_LIGHTNING_NODE_IP}:${APP_LIGHTNING_NODE_REST_PORT}
    user: "1000:1000"
    restart: on-failure
    networks: [default, manager_private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  web:
    image: ghcr.io/mandebitcoin/mostro-community-umbrel:0.1.0-preview.13
    user: "1000:1000"
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
      lnd_bridge:
        condition: service_started
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - type: bind
        source: ${APP_LIGHTNING_NODE_DATA_DIR}/tls.cert
        target: /lnd/tls.cert
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_LIGHTNING_NODE_DATA_DIR}/data/chain/bitcoin/${APP_BITCOIN_NETWORK}/readonly.macaroon
        target: /lnd/readonly.macaroon
        read_only: true
        bind:
          create_host_path: false
    environment:
      LND_REST_URL: https://localhost:8080
      LND_CONNECT_HOST: lnd_bridge:8080
      LND_TLS_CERT: /lnd/tls.cert
      LND_READONLY_MACAROON: /lnd/readonly.macaroon
    networks: [manager_private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  mostro:
    image: ghcr.io/mandebitcoin/mostro-community-umbrel:0.1.0-preview.13
    entrypoint: ["/bin/sh", "/usr/local/bin/mostro-entrypoint"]
    user: "1000:1000"
    restart: on-failure
    depends_on:

      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - type: bind
        source: ${APP_LIGHTNING_NODE_DATA_DIR}/tls.cert
        target: /lnd/tls.cert
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_LIGHTNING_NODE_DATA_DIR}/data/chain/bitcoin/${APP_BITCOIN_NETWORK}/admin.macaroon
        target: /lnd/mostro.macaroon
        read_only: true
        bind:
          create_host_path: false
    environment:
      STANDBY_IF_UNCONFIGURED: "true"
      MOSTRO_SETTINGS_DIR: /data/config/active
      MOSTRO_IDENTITY_FILE: /data/config/identity/mostro.nsec
    networks:
      - default
    security_opt: ["no-new-privileges:true"]

networks:
  manager_private:
    internal: true
