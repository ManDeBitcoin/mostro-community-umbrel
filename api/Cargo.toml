[package]
name = "mostro-community-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.23"
url = "2.5"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tonic = { version = "0.12.3", features = ["transport"] }
prost = "0.13.5"
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }

[build-dependencies]
tonic-build = "0.12.3"
protoc-bin-vendored = "3.2"

[dev-dependencies]
tempfile = "3.26"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
